[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-concierge"
version = "0.1.0"
description = "RustChain bounty ecosystem concierge - find, claim, and track bounties"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Elyan Labs", email = "scott@elyanlabs.ai"}]
dependencies = ["requests>=2.32.5"]

[project.scripts]
concierge = "concierge.entrypoint:main"
clawrtc = "concierge.entrypoint:main"
concierge-revenue = "concierge.revenue_cli:main"
concierge-discover = "concierge.discovered_revenue_intake:main"
