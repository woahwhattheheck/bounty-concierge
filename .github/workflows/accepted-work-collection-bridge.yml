name: Accepted work collection bridge

on:
  pull_request:
    paths:
      - "concierge/accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge.py"
      - "docs/accepted-work-collection-bridge.md"
      - ".github/workflows/accepted-work-collection-bridge.yml"
      - "concierge/certified_settlement_collection_queue.py"
      - "concierge/reward_settlement_certifier.py"
      - "concierge/reward_settlement_ledger.py"
      - "data/reward_settlement_ledger.synthetic.json"
  push:
    branches: [main]
    paths:
      - "concierge/accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge.py"
      - "docs/accepted-work-collection-bridge.md"
      - ".github/workflows/accepted-work-collection-bridge.yml"
      - "concierge/certified_settlement_collection_queue.py"
      - "concierge/reward_settlement_certifier.py"
      - "concierge/reward_settlement_ledger.py"
      - "data/reward_settlement_ledger.synthetic.json"

permissions:
  contents: read

concurrency:
  group: accepted-work-collection-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile concierge/accepted_work_collection_bridge.py tests/test_accepted_work_collection_bridge.py
      - run: python -m unittest -v tests.test_certified_settlement_collection_queue tests.test_accepted_work_collection_bridge
      - run: python -O -m unittest -v tests.test_certified_settlement_collection_queue tests.test_accepted_work_collection_bridge
