name: submission-transport-router

on:
  push:
    paths:
      - "concierge/submission_transport_router.py"
      - "concierge/_submission_transport_router_core.py"
      - "concierge/submission_custody.py"
      - "tests/test_submission_transport_router.py"
      - "docs/SUBMISSION_TRANSPORT_ROUTER.md"
      - ".github/workflows/submission-transport-router.yml"
  pull_request:
    paths:
      - "concierge/submission_transport_router.py"
      - "concierge/_submission_transport_router_core.py"
      - "concierge/submission_custody.py"
      - "tests/test_submission_transport_router.py"
      - "docs/SUBMISSION_TRANSPORT_ROUTER.md"
      - ".github/workflows/submission-transport-router.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile exact paths
        run: >-
          python -m py_compile
          concierge/submission_transport_router.py
          concierge/_submission_transport_router_core.py
          tests/test_submission_transport_router.py
      - name: Direct-core and host-root hostile suite
        run: python -m pytest -q tests/test_submission_transport_router.py
      - name: Direct-core and host-root hostile suite under optimized Python
        run: python -O -m pytest -q tests/test_submission_transport_router.py
