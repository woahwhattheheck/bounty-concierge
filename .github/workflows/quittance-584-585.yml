name: Quittance webhook backend catalog
on:
  push:
    branches:
      - validation/q584-q585-postgres-ledger0938
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/Quittance0
          ref: 77b18245e9d694a3b0a09900e36b2ecd3618b1c1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonical install
        working-directory: source/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          node --version | tee "$GITHUB_WORKSPACE/evidence/node-version.txt"
          npm --version | tee "$GITHUB_WORKSPACE/evidence/npm-version.txt"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/source-head.txt"
          npm ci --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/evidence/install.log"
      - name: Typecheck
        working-directory: source/backend
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/evidence/typecheck.log"
      - name: Full backend catalog
        working-directory: source/backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/evidence/backend-catalog.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quittance-584-backend-catalog
          path: evidence/
          retention-days: 7
