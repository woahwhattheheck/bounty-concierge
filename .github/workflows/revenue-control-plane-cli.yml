name: Revenue Control Plane CLI

on:
  pull_request:
    paths:
      - "concierge/revenue_cli.py"
      - "tests/test_revenue_cli.py"
      - "docs/REVENUE_CONTROL_PLANE_CLI.md"
      - "pyproject.toml"
      - ".github/workflows/revenue-control-plane-cli.yml"
  push:
    branches: [main]
    paths:
      - "concierge/revenue_cli.py"
      - "tests/test_revenue_cli.py"
      - "docs/REVENUE_CONTROL_PLANE_CLI.md"
      - "pyproject.toml"
      - ".github/workflows/revenue-control-plane-cli.yml"

permissions:
  contents: read

jobs:
  revenue-control-plane-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Grammar check
        run: python -m py_compile concierge/revenue_cli.py tests/test_revenue_cli.py
      - name: Canonical target entrypoints
        run: |
          python - <<'PY'
          import importlib
          from concierge.revenue_cli import COMMANDS
          for target, command in COMMANDS.items():
              entrypoint = getattr(importlib.import_module(command.module), "main", None)
              if not callable(entrypoint):
                  raise SystemExit(f"{target}: {command.module} has no callable main(argv)")
          print(f"validated {len(COMMANDS)} canonical target entrypoints")
          PY
      - name: Boundary tests
        run: python -m unittest -v tests.test_revenue_cli
      - name: Optimized boundary tests
        run: python -O -m unittest -v tests.test_revenue_cli
