# Evidence-carrier touch: schedule the exact hostile matrix for PR #235.
name: reinvestment authority isolation

on:
  pull_request:
    paths:
      - "concierge/__init__.py"
      - "concierge/reinvestment_allocator.py"
      - "concierge/_reinvestment_allocator_api.py"
      - "concierge/_reinvestment_allocator_cli.py"
      - "concierge/_reinvestment_allocator_transport.py"
      - "concierge/_reinvestment_allocator_worker.py"
      - "concierge/_reinvestment_allocator_core.source"
      - "tests/test_reinvestment_allocator.py"
      - "tests/test_reinvestment_preimport_bootstrap.py"
      - "tests/reinvestment_allocator_case_driver.py"
      - "tests/reinvestment_allocator_test_support.py"
      - "docs/REALIZED_REINVESTMENT_REVIEW.md"
      - ".github/workflows/reinvestment-authority.yml"
      - "concierge/revenue_closeout.py"
      - "concierge/revenue_settlement.py"
      - "concierge/realized_unit_economics.py"
  push:
    branches: [main]
    paths:
      - "concierge/__init__.py"
      - "concierge/reinvestment_allocator.py"
      - "concierge/_reinvestment_allocator_api.py"
      - "concierge/_reinvestment_allocator_cli.py"
      - "concierge/_reinvestment_allocator_transport.py"
      - "concierge/_reinvestment_allocator_worker.py"
      - "concierge/_reinvestment_allocator_core.source"
      - "tests/test_reinvestment_allocator.py"
      - "tests/test_reinvestment_preimport_bootstrap.py"
      - "tests/reinvestment_allocator_case_driver.py"
      - "tests/reinvestment_allocator_test_support.py"
      - "docs/REALIZED_REINVESTMENT_REVIEW.md"
      - ".github/workflows/reinvestment-authority.yml"
      - "concierge/revenue_closeout.py"
      - "concierge/revenue_settlement.py"
      - "concierge/realized_unit_economics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-isolation-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile authority surface
        run: |
          python -m py_compile \
            concierge/__init__.py \
            concierge/reinvestment_allocator.py \
            concierge/_reinvestment_allocator_api.py \
            concierge/_reinvestment_allocator_cli.py \
            concierge/_reinvestment_allocator_transport.py \
            concierge/_reinvestment_allocator_worker.py \
            tests/test_reinvestment_allocator.py \
            tests/test_reinvestment_preimport_bootstrap.py \
            tests/reinvestment_allocator_case_driver.py \
            tests/reinvestment_allocator_test_support.py
      - name: Run hostile suite
        shell: bash
        run: |
          if [[ "${{ matrix.mode }}" == "optimized" ]]; then
            python -O -m unittest discover -s tests -p 'test_reinvestment*.py' -v
          else
            python -m unittest discover -s tests -p 'test_reinvestment*.py' -v
          fi
