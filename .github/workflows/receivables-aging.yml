name: Merged work settlement review

on:
  pull_request:
    paths:
      - "concierge/receivables_aging.py"
      - "tests/test_receivables_aging.py"
      - "docs/RECEIVABLES_AGING.md"
      - ".github/workflows/receivables-aging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused normal tests
        run: python -m unittest -v tests.test_receivables_aging
      - name: Run focused optimized tests
        run: python -O -m unittest -v tests.test_receivables_aging
