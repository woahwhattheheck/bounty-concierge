name: Sponsor Adjudication Custody

on:
  pull_request:
    paths:
      - "concierge/sponsor_adjudication/**"
      - "tests/test_sponsor_adjudication*.py"
      - "docs/SPONSOR_ADJUDICATION.md"
      - ".github/workflows/sponsor-adjudication.yml"
  push:
    branches: [main]
    paths:
      - "concierge/sponsor_adjudication/**"
      - "tests/test_sponsor_adjudication*.py"
      - "docs/SPONSOR_ADJUDICATION.md"
      - ".github/workflows/sponsor-adjudication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Pre-authority semantic regression suite
        env:
          BOUNTY_SPONSOR_ADJUDICATION_TEST_ONLY_ALLOW_UNSIGNED: "1"
        run: python -m unittest -v tests.test_sponsor_adjudication tests.test_sponsor_adjudication_hardening
      - name: Pre-authority optimized semantic regression suite
        env:
          BOUNTY_SPONSOR_ADJUDICATION_TEST_ONLY_ALLOW_UNSIGNED: "1"
        run: python -O -m unittest -v tests.test_sponsor_adjudication tests.test_sponsor_adjudication_hardening
      - name: Host-authority hostile suite
        env:
          BOUNTY_SPONSOR_ADJUDICATION_HMAC_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
          BOUNTY_SPONSOR_ADJUDICATION_AUTHORIZED_PROVIDER: "gmail"
          BOUNTY_SPONSOR_ADJUDICATION_AUTHORIZED_PRINCIPAL_SHA256: "03b2cbe8a9410c7def5943799c27154a6e77daad63ec56df11739fc3b804e506"
        run: python -m unittest -v tests.test_sponsor_adjudication_authority tests.test_sponsor_adjudication_zero_event_authority
      - name: Host-authority optimized hostile suite
        env:
          BOUNTY_SPONSOR_ADJUDICATION_HMAC_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
          BOUNTY_SPONSOR_ADJUDICATION_AUTHORIZED_PROVIDER: "gmail"
          BOUNTY_SPONSOR_ADJUDICATION_AUTHORIZED_PRINCIPAL_SHA256: "03b2cbe8a9410c7def5943799c27154a6e77daad63ec56df11739fc3b804e506"
        run: python -O -m unittest -v tests.test_sponsor_adjudication_authority tests.test_sponsor_adjudication_zero_event_authority
      - name: Compile
        run: python -m py_compile concierge/sponsor_adjudication/*.py tests/test_sponsor_adjudication.py tests/test_sponsor_adjudication_hardening.py tests/test_sponsor_adjudication_authority.py tests/test_sponsor_adjudication_zero_event_authority.py
