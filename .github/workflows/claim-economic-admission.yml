name: Claim economic admission

on:
  pull_request:
    paths:
      - "concierge/claim_economic_admission.py"
      - "concierge/_claim_economic_admission_impl.py"
      - "concierge/_claim_economic_generation.py"
      - "concierge/entrypoint.py"
      - "concierge/paid_work_dollar_floor.py"
      - "concierge/paid_work_effort_value_gate.py"
      - "concierge/fleet_economic_admission.py"
      - "concierge/_fleet_economic_admission_v1.py"
      - "tests/test_claim_economic_admission.py"
      - "tests/test_claim_entrypoint_preflight.py"
      - "tests/test_claim_economic_generation.py"
      - "tests/test_paid_work_dollar_floor.py"
      - "tests/test_paid_work_effort_value_gate.py"
      - "policies/paid_work_dollar_floor_v1.json"
      - "policies/paid_work_effort_value_v1.json"
      - "docs/CLAIM_ECONOMIC_ADMISSION.md"
      - "docs/CLAIM_ECONOMIC_GENERATION.md"
      - ".gitattributes"
      - ".github/workflows/claim-economic-admission.yml"
  push:
    branches: [main]
    paths:
      - "concierge/claim_economic_admission.py"
      - "concierge/_claim_economic_admission_impl.py"
      - "concierge/_claim_economic_generation.py"
      - "concierge/entrypoint.py"
      - "concierge/paid_work_dollar_floor.py"
      - "concierge/paid_work_effort_value_gate.py"
      - "concierge/fleet_economic_admission.py"
      - "concierge/_fleet_economic_admission_v1.py"
      - "tests/test_claim_economic_admission.py"
      - "tests/test_claim_entrypoint_preflight.py"
      - "tests/test_claim_economic_generation.py"
      - "tests/test_paid_work_dollar_floor.py"
      - "tests/test_paid_work_effort_value_gate.py"
      - "policies/paid_work_dollar_floor_v1.json"
      - "policies/paid_work_effort_value_v1.json"
      - "docs/CLAIM_ECONOMIC_ADMISSION.md"
      - "docs/CLAIM_ECONOMIC_GENERATION.md"
      - ".gitattributes"
      - ".github/workflows/claim-economic-admission.yml"

permissions:
  contents: read

concurrency:
  group: claim-economic-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Retain exact checkout for connector-only replay
        if: matrix.python-version == '3.13'
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/claim-economic-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/claim-economic-source-commit.txt"
      - name: Export source archive (not an execution receipt)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: claim-economic-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/claim-economic-source.tar
            ${{ runner.temp }}/claim-economic-source-commit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<9'
      - name: Syntax
        run: >-
          python -m py_compile
          concierge/claim_economic_admission.py
          concierge/_claim_economic_admission_impl.py
          concierge/_claim_economic_generation.py
          concierge/paid_work_dollar_floor.py
          concierge/paid_work_effort_value_gate.py
          concierge/fleet_economic_admission.py
          concierge/entrypoint.py
          tests/test_claim_economic_admission.py
          tests/test_claim_entrypoint_preflight.py
          tests/test_claim_economic_generation.py
      - name: Focused hostile tests
        run: >-
          python -m pytest -q
          tests/test_claim_economic_admission.py
          tests/test_claim_entrypoint_preflight.py
          tests/test_paid_work_dollar_floor.py
          tests/test_paid_work_effort_value_gate.py
          tests/test_claim_economic_generation.py
      - name: Optimized hostile tests
        run: >-
          python -O -m pytest -q
          tests/test_claim_economic_admission.py
          tests/test_claim_entrypoint_preflight.py
          tests/test_paid_work_dollar_floor.py
          tests/test_paid_work_effort_value_gate.py
          tests/test_claim_economic_generation.py
