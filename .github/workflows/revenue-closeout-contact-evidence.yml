name: Revenue closeout contact evidence

on:
  pull_request:
    paths:
      - "concierge/revenue_closeout.py"
      - "concierge/revenue_closeout_core.py"
      - "tests/test_revenue_closeout.py"
      - "tests/test_revenue_closeout_contact_evidence.py"
      - "docs/REVENUE_CLOSEOUT_CONTACT_EVIDENCE.md"
      - ".github/workflows/revenue-closeout-contact-evidence.yml"
  push:
    branches:
      - main
    paths:
      - "concierge/revenue_closeout.py"
      - "concierge/revenue_closeout_core.py"
      - "tests/test_revenue_closeout.py"
      - "tests/test_revenue_closeout_contact_evidence.py"
      - "docs/REVENUE_CLOSEOUT_CONTACT_EVIDENCE.md"
      - ".github/workflows/revenue-closeout-contact-evidence.yml"

permissions:
  contents: read

concurrency:
  group: revenue-closeout-contact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout-contact-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile closeout sources
        run: >-
          python -m py_compile
          concierge/revenue_closeout.py
          concierge/revenue_closeout_core.py
          tests/test_revenue_closeout.py
          tests/test_revenue_closeout_contact_evidence.py
      - name: Run closeout regressions
        run: >-
          python -m unittest -v
          tests.test_revenue_closeout
          tests.test_revenue_closeout_contact_evidence
      - name: Run optimized closeout regressions
        run: >-
          python -O -m unittest -v
          tests.test_revenue_closeout
          tests.test_revenue_closeout_contact_evidence
