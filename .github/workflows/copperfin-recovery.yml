name: Copperfin bounded recovery comparison
on:
  push:
    branches: [validation/copperfin-recovery-20261004]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/bounty-concierge
          ref: 01f6d3bac65b4616a3d8726a68ccfd40006834fb
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared runtime dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Compare actual offline recovery and outputs
        working-directory: subject
        run: python ../measure_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copperfin-recovery-measurement
          path: subject/recovery-measurement.json
          if-no-files-found: warn
