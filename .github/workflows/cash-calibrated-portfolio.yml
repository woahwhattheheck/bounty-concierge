name: Cash-Calibrated Portfolio

on:
  pull_request:
    paths:
      - "concierge/cash_calibrated_portfolio.py"
      - "tests/test_cash_calibrated_portfolio.py"
      - "docs/cash-calibrated-portfolio.md"
      - ".github/workflows/cash-calibrated-portfolio.yml"
  push:
    branches:
      - main
    paths:
      - "concierge/cash_calibrated_portfolio.py"
      - "tests/test_cash_calibrated_portfolio.py"
      - "docs/cash-calibrated-portfolio.md"
      - ".github/workflows/cash-calibrated-portfolio.yml"

permissions:
  contents: read

concurrency:
  group: cash-calibrated-portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Python ${{ matrix.python-version }} normal + optimized
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<9'

      - name: Compile focused product
        run: python -m compileall -q concierge/cash_calibrated_portfolio.py tests/test_cash_calibrated_portfolio.py

      - name: Run focused tests
        run: python -m pytest -v tests/test_cash_calibrated_portfolio.py

      - name: Run focused tests under optimization
        run: python -O -m pytest -v tests/test_cash_calibrated_portfolio.py
