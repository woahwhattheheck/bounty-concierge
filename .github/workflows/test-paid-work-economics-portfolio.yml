name: paid-work-economics-portfolio
on:
  pull_request:
    paths:
      - 'concierge/paid_work_economics_portfolio.py'
      - 'tests/test_paid_work_economics_portfolio.py'
      - 'examples/paid_work_economics_portfolio_demo.py'
      - 'docs/PAID_WORK_ECONOMICS_PORTFOLIO.md'
      - '.github/workflows/test-paid-work-economics-portfolio.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/paid_work_economics_portfolio.py'
      - 'tests/test_paid_work_economics_portfolio.py'
      - 'examples/paid_work_economics_portfolio_demo.py'
      - 'docs/PAID_WORK_ECONOMICS_PORTFOLIO.md'
      - '.github/workflows/test-paid-work-economics-portfolio.yml'
concurrency:
  group: paid-work-economics-portfolio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m py_compile concierge/paid_work_economics_portfolio.py tests/test_paid_work_economics_portfolio.py examples/paid_work_economics_portfolio_demo.py
      - run: python -m unittest -v tests.test_paid_work_economics_portfolio
      - run: python -O -m unittest -v tests.test_paid_work_economics_portfolio
      - run: |
          tmp="$(mktemp -d)"
          python examples/paid_work_economics_portfolio_demo.py --out-dir "$tmp/demo"
          python -m concierge.paid_work_economics_portfolio verify "$tmp/demo/input.json" --report "$tmp/demo/portfolio.json" --markdown "$tmp/demo/portfolio.md" --receipt "$tmp/demo/receipt.json"
