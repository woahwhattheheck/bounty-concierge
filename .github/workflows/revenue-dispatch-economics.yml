name: Revenue Dispatch Economics Gate

on:
  pull_request:
    paths:
      - "concierge/revenue_dispatch.py"
      - "concierge/paid_work_effort_value_gate.py"
      - "tests/test_revenue_dispatch.py"
      - "docs/PAID_WORK_DISPATCH_WIRING.md"
      - ".github/workflows/revenue-dispatch-economics.yml"
  push:
    branches: [main]
    paths:
      - "concierge/revenue_dispatch.py"
      - "concierge/paid_work_effort_value_gate.py"
      - "tests/test_revenue_dispatch.py"
      - "docs/PAID_WORK_DISPATCH_WIRING.md"
      - ".github/workflows/revenue-dispatch-economics.yml"

permissions:
  contents: read

concurrency:
  group: revenue-dispatch-economics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile focused seam
        run: python -m compileall -q concierge/revenue_dispatch.py tests/test_revenue_dispatch.py
      - name: Run focused tests
        run: python -m unittest -v tests.test_revenue_dispatch
      - name: Run focused tests under optimization
        run: python -O -m unittest -v tests.test_revenue_dispatch
