name: Payoff Path Gate

on:
  pull_request:
    paths:
      - "concierge/__init__.py"
      - "concierge/payoff_path_gate.py"
      - "concierge/payoff_path_gate_core.py"
      - "concierge/payoff_path_policy_v3.py"
      - "tests/test_payoff_path_gate.py"
      - "tests/test_payoff_path_continuity.py"
      - "tests/test_payoff_path_policy_v3.py"
      - "tests/test_payoff_path_file_custody.py"
      - "docs/PAYOFF_PATH_GATE.md"
      - "docs/PAYOFF_PATH_FILE_CUSTODY.md"
      - ".github/workflows/payoff-path-gate.yml"
  push:
    branches:
      - main
    paths:
      - "concierge/__init__.py"
      - "concierge/payoff_path_gate.py"
      - "concierge/payoff_path_gate_core.py"
      - "concierge/payoff_path_policy_v3.py"
      - "tests/test_payoff_path_gate.py"
      - "tests/test_payoff_path_continuity.py"
      - "tests/test_payoff_path_policy_v3.py"
      - "tests/test_payoff_path_file_custody.py"
      - "docs/PAYOFF_PATH_GATE.md"
      - "docs/PAYOFF_PATH_FILE_CUSTODY.md"
      - ".github/workflows/payoff-path-gate.yml"

permissions:
  contents: read

concurrency:
  group: payoff-path-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python ${{ matrix.python-version }} payoff path gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Compile payoff path source
        run: >-
          python -m py_compile
          concierge/__init__.py
          concierge/payoff_path_gate.py
          concierge/payoff_path_gate_core.py
          concierge/payoff_path_policy_v3.py
          tests/test_payoff_path_gate.py
          tests/test_payoff_path_continuity.py
          tests/test_payoff_path_policy_v3.py
          tests/test_payoff_path_file_custody.py
      - name: Run payoff path hostile tests
        run: >-
          python -m pytest -q
          tests/test_payoff_path_gate.py
          tests/test_payoff_path_continuity.py
          tests/test_payoff_path_policy_v3.py
          tests/test_payoff_path_file_custody.py
      - name: Run optimized payoff path hostile tests
        run: >-
          python -O -m pytest -q
          tests/test_payoff_path_gate.py
          tests/test_payoff_path_continuity.py
          tests/test_payoff_path_policy_v3.py
          tests/test_payoff_path_file_custody.py
