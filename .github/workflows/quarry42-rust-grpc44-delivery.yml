name: Preserve checked rust-grpc44 delivery
on:
  push:
    branches: [quarry42/rust-grpc44]
    paths: [.github/workflows/quarry42-rust-grpc44-delivery.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: quarry42-rust-grpc44-delivery
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'woahwhattheheck/bounty-concierge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11317985872
          run-id: 37242196793
          github-token: ${{ github.token }}
          path: bundle
          merge-multiple: true
      - name: Recover exact checked files and render the required walkthrough
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          root = Path('bundle')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['run_id'] == '37242196793'
          assert manifest['handoff_sha'] == 'e5204b6aa8d4acc62999f54d443a6a1d3abc3fa3'
          assert hashlib.sha256((root / 'implementation.patch').read_bytes()).hexdigest() == '2b1050c26edf9ac1cdc261385f34cb0989ec45fa3b6148a1810a27e55dfa3ee0'
          source = root / 'source'
          source.mkdir()
          with tarfile.open(root / 'candidate.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              assert {m.name for m in members} == set(manifest['files'])
              for member in members:
                  assert member.isfile() and member.size < 1048576
                  target = source / member.name
                  assert source.resolve() in target.resolve().parents
                  data = archive.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == manifest['files'][member.name]['sha256']
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
          python3 work/rust-grpc44-demo/render_demo.py bundle out/rust-grpc44-demo.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height -of json out/rust-grpc44-demo.mp4 > out/video-metadata.json
      - name: Build the durable delivery directory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          output = Path('work/rust-grpc44-delivery')
          assert not output.exists()
          output.mkdir(parents=True)
          shutil.copytree('bundle/source', output / 'source')
          for name in ['implementation.patch', 'manifest.json', 'dependencies.txt']:
              shutil.copyfile(Path('bundle') / name, output / name)
          for name in ['rust-grpc44-demo.mp4', 'rust-grpc44-demo.txt', 'video-metadata.json']:
              shutil.copyfile(Path('out') / name, output / name)
          video = output / 'rust-grpc44-demo.mp4'
          receipt = {
              'operation_id': 'QUARRY42-RUSTGRPC44-PUBLISH',
              'attempt_operation_id': 'QUARRY42-RUSTGRPC44-PUBLISH-attempt',
              'source_owner': 'QUARRY-42',
              'upstream_repository': 'tailcallhq/rust-grpc',
              'issue_number': 44,
              'payout_identity': 'woahwhattheheck',
              'advertised_bounty_usd': 50,
              'award_or_payment_confirmed': False,
              'source_base': 'e5faeec6e9d833ecf5d46da718d3d0b5e2b9e542',
              'validation_run': 37242196793,
              'validation_job': 111552975327,
              'validation_handoff_sha': 'e5204b6aa8d4acc62999f54d443a6a1d3abc3fa3',
              'validation_result': 'success',
              'implementation_patch_sha256': '2b1050c26edf9ac1cdc261385f34cb0989ec45fa3b6148a1810a27e55dfa3ee0',
              'demo_sha256': hashlib.sha256(video.read_bytes()).hexdigest(),
              'demo_description': '40-second checked-code and recorded-CI walkthrough, not live production footage',
              'publication_state': 'not_submitted',
              'last_publication_run': 37242694417,
              'last_publication_result': 'identity_read_rate_limited_before_any_write',
              'provider_reset_utc': '2026-10-04T23:32:14Z',
          }
          (output / 'publication-manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (output / 'PR.md').write_text('''# chore: update dependencies and migrate gRPC telemetry APIs

/claim #44

Updates the dependency graph and lockfile to compatible current releases. Migrates Tonic/Prost generation and server transport, updates OpenTelemetry exporter/provider initialization, and synchronizes the generated CI workflow. Existing News RPC implementations and the protobuf schema are unchanged; reflection remains on v1alpha.

Validation: `cargo fmt --all -- --check`, `cargo test --locked --all-features`, and `cargo clippy --locked --all-targets --all-features -- -D warnings` passed on Rust 1.99.0. The existing workflow-generation test is retained; no new test suite was added. README prerequisites now state Rust 1.91 or newer and protoc; the minimum compiler version was not separately exercised.

The accompanying `rust-grpc44-demo.mp4` is a 40-second walkthrough of the checked code and recorded CI result. No production deployment or paid telemetry calls were made.
''')
          PY
      - name: Preserve only the delivery packet on the existing owned branch
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/quarry42/rust-grpc44 | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- work/rust-grpc44-delivery
          git commit -m 'Preserve checked rust-grpc dependency upgrade and walkthrough'
          git push origin HEAD:refs/heads/quarry42/rust-grpc44
          expected=$(git rev-parse HEAD)
          actual=$(git ls-remote origin refs/heads/quarry42/rust-grpc44 | cut -f1)
          test "$actual" = "$expected"
          printf '{"delivery_commit":"%s","readback":"verified"}\n' "$actual" | tee out/delivery-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-grpc44-complete-delivery-${{ github.sha }}
          path: |
            work/rust-grpc44-delivery/
            out/delivery-receipt.json
          retention-days: 14
