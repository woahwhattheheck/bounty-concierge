name: certified-settlement-collection-terminal

on:
  pull_request:
    paths:
      - 'concierge/certified_settlement_collection_queue.py'
      - 'concierge/certified_settlement_collection_review_packet.py'
      - 'tests/test_certified_settlement_collection_queue.py'
      - 'tests/test_certified_settlement_collection_review_packet.py'
      - 'examples/certified_settlement_collection_review_packet_demo.py'
      - 'data/reward_settlement_ledger.synthetic.json'
      - 'docs/certified-settlement-collection-queue.md'
      - '.github/workflows/certified-settlement-collection-terminal.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/certified_settlement_collection_queue.py'
      - 'concierge/certified_settlement_collection_review_packet.py'
      - 'tests/test_certified_settlement_collection_queue.py'
      - 'tests/test_certified_settlement_collection_review_packet.py'
      - 'examples/certified_settlement_collection_review_packet_demo.py'
      - 'data/reward_settlement_ledger.synthetic.json'
      - 'docs/certified-settlement-collection-queue.md'
      - '.github/workflows/certified-settlement-collection-terminal.yml'

permissions:
  contents: read

jobs:
  focused:
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax proof
        run: >-
          python -m py_compile
          concierge/certified_settlement_collection_queue.py
          concierge/certified_settlement_collection_review_packet.py
          tests/test_certified_settlement_collection_queue.py
          tests/test_certified_settlement_collection_review_packet.py
          examples/certified_settlement_collection_review_packet_demo.py
      - name: Focused tests
        run: >-
          python -m unittest -v
          tests.test_certified_settlement_collection_queue
          tests.test_certified_settlement_collection_review_packet
      - name: Focused tests under optimization
        run: >-
          python -O -m unittest -v
          tests.test_certified_settlement_collection_queue
          tests.test_certified_settlement_collection_review_packet
      - name: Synthetic review-packet demo
        run: python examples/certified_settlement_collection_review_packet_demo.py
