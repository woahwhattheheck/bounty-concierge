name: reward-settlement-certifier

on:
  pull_request:
    paths:
      - 'concierge/reward_settlement_certifier.py'
      - 'tests/test_reward_settlement_certifier.py'
      - 'docs/reward-settlement-certifier.md'
      - '.github/workflows/reward-settlement-certifier.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/reward_settlement_certifier.py'
      - 'tests/test_reward_settlement_certifier.py'
      - 'docs/reward-settlement-certifier.md'
      - '.github/workflows/reward-settlement-certifier.yml'

jobs:
  certifier:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile concierge/reward_settlement_certifier.py tests/test_reward_settlement_certifier.py
      - name: Test
        run: python -m unittest -q tests.test_reward_settlement_certifier
      - name: Test optimized
        run: python -O -m unittest -q tests.test_reward_settlement_certifier
