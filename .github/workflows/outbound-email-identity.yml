name: Outbound Email Identity

on:
  pull_request:
    paths:
      - "concierge/outbound_email_identity.py"
      - "concierge/outbound_dedupe.py"
      - "concierge/outbound_singlewriter.py"
      - "tests/test_outbound_email_identity.py"
      - ".github/workflows/outbound-email-identity.yml"
  push:
    branches: [main]
    paths:
      - "concierge/outbound_email_identity.py"
      - "concierge/outbound_dedupe.py"
      - "concierge/outbound_singlewriter.py"
      - "tests/test_outbound_email_identity.py"
      - ".github/workflows/outbound-email-identity.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile concierge/outbound_email_identity.py tests/test_outbound_email_identity.py
      - name: Focused hostile suite
        run: python -m unittest discover -s tests -p 'test_outbound_email_identity.py' -v
      - name: Focused hostile suite under optimized interpreter
        run: python -O -m unittest discover -s tests -p 'test_outbound_email_identity.py' -v
