name: Q586 seller session CI

on:
  push:
    branches:
      - validation/q586-seller-session-ledger0938

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only read the repository: the bump to `write` is a deliberate
# change, not a default to inherit.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    env:
      # The integration test starts its own Horizon stub on a loopback port and
      # overrides this at runtime. It is set here so the suite never reaches the
      # public testnet even if a test forgets to override it.
      STELLAR_NETWORK: TESTNET
      STELLAR_HORIZON_URL: http://127.0.0.1:1
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/Quittance0
          ref: d9322f3f5a11533d46825c2894034e10214a3192
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # The backend suite drives Node own test runner (node --import tsx
          # --test). On 20 that runner intermittently fails inside its own IPC
          # layer with Unable to deserialize cloned data (raised in
          # #processRawBuffer / FileTest.parseMessage) on the same test file that
          # passes alone, while every assertion in the suite passes. Reproduced
          # locally: 5/5 full-suite runs fail on 20, 4/4 pass on 22 and 24 with
          # the suite unchanged. 24 is the runtime the other two jobs already use,
          # and no test, script or assertion is changed by this.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Record immutable source and runtime
        run: |
          node --version | tee "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          npm --version | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          printf '%s\n' 'source=d9322f3f5a11533d46825c2894034e10214a3192' | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-install.log"

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-typecheck.log"

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-tests.log"

      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q586-${{ github.job }}-logs
          path: q586-${{ github.job }}-*.log
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend — lint, typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET

    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/Quittance0
          ref: d9322f3f5a11533d46825c2894034e10214a3192
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # The frontend suite loads the shipped .ts modules directly, which
          # needs Node's default type stripping (22.18+). On 20 every test
          # file failed to parse before a single assertion ran. 24 also
          # matches the job the shared-contract tests already run on.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record immutable source and runtime
        run: |
          node --version | tee "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          npm --version | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          printf '%s\n' 'source=d9322f3f5a11533d46825c2894034e10214a3192' | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-install.log"

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-lint.log"

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-typecheck.log"

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-tests.log"

      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q586-${{ github.job }}-logs
          path: q586-${{ github.job }}-*.log
          if-no-files-found: error
          retention-days: 7

  root-tests:
    name: Shared export tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/Quittance0
          ref: d9322f3f5a11533d46825c2894034e10214a3192
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record immutable source and runtime
        run: |
          node --version | tee "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          npm --version | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"
          printf '%s\n' 'source=d9322f3f5a11533d46825c2894034e10214a3192' | tee -a "${{ github.workspace }}/q586-${{ github.job }}-runtime.log"

      # The same glob the README documents for a local run, so a new shared
      # suite is picked up here by existing rather than by editing this file.
      - name: Test
        run: |
          set -o pipefail
          node --test "tests/**/*.test.mjs" 2>&1 | tee "${{ github.workspace }}/q586-${{ github.job }}-tests.log"

      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q586-${{ github.job }}-logs
          path: q586-${{ github.job }}-*.log
          if-no-files-found: error
          retention-days: 7
