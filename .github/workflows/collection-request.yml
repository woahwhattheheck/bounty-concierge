name: Collection Request

on:
  pull_request:
    paths:
      - 'concierge/collection_request.py'
      - 'tests/test_collection_request.py'
      - 'docs/COLLECTION_REQUEST.md'
      - '.github/workflows/collection-request.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/collection_request.py'
      - 'tests/test_collection_request.py'
      - 'docs/COLLECTION_REQUEST.md'
      - '.github/workflows/collection-request.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile concierge/collection_request.py tests/test_collection_request.py
      - name: Tests
        run: python -m unittest -v tests.test_collection_request
      - name: Tests under optimized mode
        run: python -O -m unittest -v tests.test_collection_request
