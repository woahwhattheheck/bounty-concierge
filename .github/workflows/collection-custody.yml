name: Collection Custody

on:
  pull_request:
    paths:
      - 'concierge/collection_custody.py'
      - 'tests/test_collection_custody.py'
      - 'docs/COLLECTION_CUSTODY.md'
      - '.github/workflows/collection-custody.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/collection_custody.py'
      - 'tests/test_collection_custody.py'
      - 'docs/COLLECTION_CUSTODY.md'
      - '.github/workflows/collection-custody.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile concierge/collection_custody.py tests/test_collection_custody.py
      - name: Tests
        run: python -m unittest -v tests.test_collection_custody
      - name: Tests under optimized mode
        run: python -O -m unittest -v tests.test_collection_custody
