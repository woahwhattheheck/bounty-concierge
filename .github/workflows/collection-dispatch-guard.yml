name: collection-dispatch-guard

on:
  pull_request:
    paths:
      - "concierge/collection_dispatch_guard.py"
      - "tests/test_collection_dispatch_guard.py"
      - "docs/COLLECTION_DISPATCH_GUARD.md"
      - ".github/workflows/collection-dispatch-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile guard
        run: python -m py_compile concierge/collection_dispatch_guard.py
      - name: Run focused regressions
        run: python -m pytest -q tests/test_collection_dispatch_guard.py
