name: provider-attempt-continuity

on:
  pull_request:
    paths:
      - 'concierge/provider_attempt_continuity.py'
      - 'tests/test_provider_attempt_continuity.py'
      - 'docs/PROVIDER_ATTEMPT_CONTINUITY.md'
      - '.github/workflows/provider-attempt-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Normal interpreter
        run: python -m unittest discover -s tests -p 'test_provider_attempt_continuity.py' -v
      - name: Optimized interpreter
        run: python -O -m unittest discover -s tests -p 'test_provider_attempt_continuity.py' -v
