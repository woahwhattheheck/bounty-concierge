name: Forecast Calibration

on:
  pull_request:
    paths:
      - "concierge/forecast_calibration.py"
      - "tests/test_forecast_calibration.py"
      - "docs/FORECAST_CALIBRATION.md"
      - ".github/workflows/forecast-calibration.yml"
  push:
    branches:
      - main
    paths:
      - "concierge/forecast_calibration.py"
      - "tests/test_forecast_calibration.py"
      - "docs/FORECAST_CALIBRATION.md"
      - ".github/workflows/forecast-calibration.yml"

permissions:
  contents: read

concurrency:
  group: forecast-calibration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    name: Python ${{ matrix.python-version }} calibration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -r requirements.txt 'pytest>=8,<9'
      - name: Compile calibration source
        run: python -m py_compile concierge/forecast_calibration.py tests/test_forecast_calibration.py
      - name: Run calibration tests
        run: python -m pytest -q tests/test_forecast_calibration.py
