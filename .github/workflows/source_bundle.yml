name: Export source bundle
run-name: Source bundle ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA in this repository (reuse an existing artifact first)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: source-bundle-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          fi

      - name: Check out the requested commit without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Export tracked source and provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          expected = os.environ["SOURCE_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("checked-out commit differs from source_sha")
          destination = Path(os.environ["RUNNER_TEMP"]) / "source-bundle"
          destination.mkdir()
          archive = destination / "source.tar.gz"
          subprocess.run([
              "git", "archive", "--format=tar.gz", "--prefix=source/",
              "--output", str(archive), actual,
          ], check=True)
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          manifest = {
              "schema": "github-source-bundle/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": actual,
              "tree_sha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "archive": {
                  "file": archive.name, "sha256": digest.hexdigest(),
                  "size_bytes": archive.stat().st_size, "format": "git-archive/tar.gz",
              },
              "scope": "Tracked git-archive export only; honors export attributes. No git history, submodule contents or LFS hydration.",
          }
          (destination / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Source bundle\nRepository: `{manifest['repository']}`\n\n")
              summary.write(f"Commit: `{actual}`\n\nArchive SHA-256: `{digest.hexdigest()}`\n\n")
              summary.write(f"Archive bytes: {archive.stat().st_size}\n\nReuse this artifact for the same commit; it does not establish current bounty state.\n")
          PY

      - name: Publish reusable source artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/source-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
