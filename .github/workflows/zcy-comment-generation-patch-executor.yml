name: ZCY exact comment-generation patch executor

on:
  push:
    branches:
      - zcy-r7v4/patch-executor-comment-generation-20260913

permissions:
  contents: write

concurrency:
  group: zcy-comment-generation-patch-executor
  cancel-in-progress: false

jobs:
  apply-validate-and-commit:
    if: github.event.head_commit.message == 'chore: stage exact comment-generation patch executor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact executor branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply the owner-staged patch exactly
        shell: bash
        run: |
          set -euo pipefail
          git apply --check COMMENT_GENERATION_FIX.patch
          git apply COMMENT_GENERATION_FIX.patch
          rm COMMENT_GENERATION_FIX.patch
          rm .github/workflows/zcy-comment-generation-patch-executor.yml

      - name: Verify exact path scope
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '.github/workflows/zcy-comment-generation-patch-executor.yml' \
            'COMMENT_GENERATION_FIX.patch' \
            'concierge/bounty_preflight.py' \
            'tests/test_bounty_preflight.py' \
            | LC_ALL=C sort > /tmp/expected-paths
          git status --porcelain=v1 | cut -c4- | LC_ALL=C sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<9'

      - name: Compile patched source and test
        run: python -m py_compile concierge/bounty_preflight.py tests/test_bounty_preflight.py

      - name: Run focused exact-branch suite
        run: python -m pytest -q tests/test_bounty_preflight.py

      - name: Commit validated generated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Z-CalabiYau-913621-R7V4'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix same-second comment authority generation binding'
          git push origin HEAD:"${GITHUB_REF_NAME}"
