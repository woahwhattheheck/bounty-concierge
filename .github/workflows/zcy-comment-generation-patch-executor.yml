name: ZCY Exact Patch Executor

"on":
  push:
    branches:
      - "zcy-r7v4/patch-executor-comment-generation-20260913"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact staged patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check COMMENT_GENERATION_FIX.patch
          git apply COMMENT_GENERATION_FIX.patch
          rm COMMENT_GENERATION_FIX.patch
          rm .github/workflows/zcy-comment-generation-patch-executor.yml

      - name: Verify path scope
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '.github/workflows/zcy-comment-generation-patch-executor.yml' \
            'COMMENT_GENERATION_FIX.patch' \
            'concierge/bounty_preflight.py' \
            'tests/test_bounty_preflight.py' \
            | LC_ALL=C sort > /tmp/expected-paths
          git status --porcelain=v1 | cut -c4- | LC_ALL=C sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Validate focused suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt 'pytest>=8,<9'
          python -m py_compile concierge/bounty_preflight.py tests/test_bounty_preflight.py
          python -m pytest -q tests/test_bounty_preflight.py

      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Z-CalabiYau-913621-R7V4'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix same-second comment authority generation binding'
          git push origin "HEAD:${GITHUB_REF_NAME}"
