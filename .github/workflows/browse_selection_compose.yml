name: Compose prepared browse selection
on:
  push:
    branches: ["compose/browse-bounded-selection-20261004-bh04"]
    paths: [".github/workflows/browse_selection_compose.yml"]
permissions:
  contents: write
concurrency:
  group: browse-bounded-selection-20261004-bh04
  cancel-in-progress: false
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the observed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0aa507c40c7b5685aaa45ae22116359e05787231
          fetch-depth: 1
      - name: Apply exact prepared source postimage
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('concierge/cli.py')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          data = p.read_bytes()
          assert blob(data) == '9a5ac2c9ae3c4a06907b357fb4d0f99e31183154'
          s = data.decode()
          replacements = [
              ('def _filter_bounties(bounties, args):', 'def _filter_bounties(bounties, args, *, presort=True):'),
              ('    filtered.sort(key=reward_sort_key, reverse=True)\n    return filtered', '    if presort:\n        filtered.sort(key=reward_sort_key, reverse=True)\n    return filtered'),
              ('    filtered = _filter_bounties(rows, args)\n    displayed = filtered[:args.limit]', '    filtered = _filter_bounties(rows, args, presort=False)\n    displayed = _limit_bounties(filtered, args.limit)'),
              ('    filtered = _filter_bounties(report["bounties"], args)\n    displayed = filtered[: args.limit]', '    filtered = _filter_bounties(report["bounties"], args, presort=False)\n    displayed = _limit_bounties(filtered, args.limit)'),
          ]
          for before, after in replacements:
              assert s.count(before) == 1
              s = s.replace(before, after, 1)
          helper = '''def _limit_bounties(bounties, limit):
              """Select stable display rows without sorting every undisplayed match."""
              from heapq import nlargest
              from concierge.reward_evidence import reward_sort_key

              # nlargest preserves input order for equal keys and uses a full sort when
              # the display limit covers the input. Filtering/counting still sees all rows.
              return nlargest(limit, bounties, key=reward_sort_key)


          '''
          assert s.count('def _incomplete_browse_message(report):') == 1
          s = s.replace('def _incomplete_browse_message(report):', helper+'def _incomplete_browse_message(report):', 1)
          data = s.encode()
          assert blob(data) == '5474757128ddcb01d849f2503a9a678f159ce66f'
          p.write_bytes(data)
          print('Source postimage:', blob(data))
          PY
      - name: Publish only the prepared source branch
        shell: bash
        run: |
          git config user.name woahwhattheheck
          git config user.email 293286387+woahwhattheheck@users.noreply.github.com
          git add -- concierge/cli.py
          test "$(git diff --cached --name-only)" = concierge/cli.py
          git commit -m "Avoid sorting undisplayed bounty matches"
          git push origin HEAD:refs/heads/perf/browse-bounded-selection-20261004-bh04
          printf 'Published source commit: '
          git rev-parse HEAD
