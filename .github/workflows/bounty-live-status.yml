name: Bounty Live Status

on:
  pull_request:
    paths:
      - "concierge/bounty_live_status.py"
      - "tests/test_bounty_live_status.py"
      - "docs/BOUNTY_LIVE_STATUS.md"
      - ".github/workflows/bounty-live-status.yml"
  push:
    branches: [main]
    paths:
      - "concierge/bounty_live_status.py"
      - "tests/test_bounty_live_status.py"
      - "docs/BOUNTY_LIVE_STATUS.md"
      - ".github/workflows/bounty-live-status.yml"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile concierge/bounty_live_status.py tests/test_bounty_live_status.py
      - run: python -m unittest tests.test_bounty_live_status
      - run: python -O -m unittest tests.test_bounty_live_status
