name: External contract qualification

on:
  pull_request:
    paths:
      - 'concierge/contract_qualification.py'
      - 'tests/test_contract_qualification.py'
      - 'docs/EXTERNAL_CONTRACT_QUALIFICATION.md'
      - '.github/workflows/external_contract_qualification.yml'
  push:
    branches: [main]
    paths:
      - 'concierge/contract_qualification.py'
      - 'tests/test_contract_qualification.py'
      - 'docs/EXTERNAL_CONTRACT_QUALIFICATION.md'
      - '.github/workflows/external_contract_qualification.yml'

permissions:
  contents: read

jobs:
  contract-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile concierge/contract_qualification.py tests/test_contract_qualification.py
      - name: Focused hostiles
        run: python -m unittest -v tests.test_contract_qualification
      - name: Optimized hostiles
        run: python -O -m unittest -v tests.test_contract_qualification
