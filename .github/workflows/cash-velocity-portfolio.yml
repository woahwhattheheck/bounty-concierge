name: Cash Velocity Portfolio

on:
  pull_request:
    paths:
      - "concierge/cash_velocity_portfolio.py"
      - "tests/test_cash_velocity_portfolio.py"
      - "docs/cash_velocity_portfolio.md"
      - ".github/workflows/cash-velocity-portfolio.yml"
      - "concierge/cash_calibrated_portfolio.py"
      - "concierge/cash_cycle_review.py"
      - "concierge/portfolio_allocator.py"
      - "concierge/opportunity_ranker.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Focused tests
        run: python -m unittest discover -s tests -p 'test_cash_velocity_portfolio.py' -v
      - name: Optimized focused tests
        run: python -O -m unittest discover -s tests -p 'test_cash_velocity_portfolio.py' -v
      - name: Compile
        run: python -m py_compile concierge/cash_velocity_portfolio.py tests/test_cash_velocity_portfolio.py
