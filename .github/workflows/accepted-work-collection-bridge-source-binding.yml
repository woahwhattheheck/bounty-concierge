name: Accepted work source binding

on:
  pull_request:
    paths:
      - "concierge/accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge_source_binding.py"
      - ".github/workflows/accepted-work-collection-bridge-source-binding.yml"
  push:
    branches: [main]
    paths:
      - "concierge/accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge.py"
      - "tests/test_accepted_work_collection_bridge_source_binding.py"
      - ".github/workflows/accepted-work-collection-bridge-source-binding.yml"

permissions:
  contents: read

concurrency:
  group: accepted-work-source-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile concierge/accepted_work_collection_bridge.py tests/test_accepted_work_collection_bridge.py tests/test_accepted_work_collection_bridge_source_binding.py
      - run: python -m unittest -v tests.test_accepted_work_collection_bridge tests.test_accepted_work_collection_bridge_source_binding
      - run: python -O -m unittest -v tests.test_accepted_work_collection_bridge tests.test_accepted_work_collection_bridge_source_binding
