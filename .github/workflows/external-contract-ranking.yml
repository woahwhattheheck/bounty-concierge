name: External contract partitioned ranking

on:
  pull_request:
    paths:
      - 'concierge/external_contract_ranker.py'
      - 'tests/test_external_contract_ranker.py'
      - 'docs/EXTERNAL_CONTRACT_RANKING.md'
      - '.github/workflows/external-contract-ranking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile focused source
        run: python -m py_compile concierge/external_contract_ranker.py tests/test_external_contract_ranker.py
      - name: Focused hostile suite
        run: python -m unittest -v tests.test_external_contract_ranker
      - name: Focused hostile suite under optimized Python
        run: python -O -m unittest -v tests.test_external_contract_ranker
