[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pr-reviewer"
version = "0.1.0"
description = "Claude Code PR reviewer with deterministic structured Markdown output"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claude-review = "claude_pr_reviewer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
